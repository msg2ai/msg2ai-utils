name: Publish

# Manual only. `release: created` does not fire for drafts and needs a fresh
# tag each time; a human asking, with the version stated, is both simpler and
# auditable.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (must match every package.json)
        required: true
      dry_run:
        description: Run npm publish --dry-run instead of publishing
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Bind to an environment with a required reviewer: an OIDC trust bound
    # only to a filename lets any push with write access publish.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Pinned: npm's trusted-publishing support has moved between minors.
      - run: npm install -g npm@11

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Must precede the preflight: the toolkit's bin targets live in dist/,
      # and the preflight refuses to publish a manifest whose bin does not
      # exist rather than shipping a package whose command is missing.
      - run: npm run build

      # Every check for every package, before anything is published. The root
      # is `private: true`, so publishing from there was never going to work —
      # the five workspace packages are published individually, toolkit first,
      # because the aliases depend on it at an exact version.
      # The registry manifests name the same versions as package.json, so a
      # release is exactly when they drift.
      - name: Validate registry manifests
        run: node scripts/validate-registry.mjs

      - name: Preflight
        run: node scripts/release.mjs --check "${{ inputs.version }}"

      # NODE_AUTH_TOKEN is only needed until each package exists: npm accepts a
      # trusted publisher on a package it already knows, so the first release
      # cannot use OIDC. Configure trusted publishing after this run, delete
      # the secret, and later runs authenticate with no long-lived credential.
      # --provenance uses the OIDC token either way.
      - name: Publish
        run: >-
          node scripts/release.mjs --publish "${{ inputs.version }}"
          ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
